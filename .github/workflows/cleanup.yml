name: cleanup-hosting

# Every hour: check which scheduled posts went out (Buffer status) and delete each video from
# Cloudinary as soon as every platform has it, so the free storage never fills up.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # the watchdog reads which jobs failed

concurrency:
  group: cleanup-hosting
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Records from the private repo
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: bash tools/state.sh pull

      - name: Training data repo (only its index; the audio stays up there)
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: bash tools/dataset.sh pull || echo "dataset repo unavailable - skipping collection"

      # FFmpeg (cached static build): the audio of each published clip is kept as training data
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1-gpl

      - name: FFmpeg
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz               | tar -xJ -C "$HOME/ffmpeg" --strip-components=1 || rm -rf "$HOME/ffmpeg/bin"
          fi
          if [ -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages (light)
        run: pip install requests pyyaml python-dotenv tenacity tzdata

      - name: Refresh post statuses, delete published videos from Cloudinary
        run: python -m src.publish.runner --cleanup

      - name: Watchdog — tell you about any job that failed in the last hour
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m src.health --watchdog || true

      - name: Save
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          bash tools/state.sh save "cleanup: $(TZ=Africa/Cairo date '+%F %H:%M')"
          bash tools/dataset.sh save
