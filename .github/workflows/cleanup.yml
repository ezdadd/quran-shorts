name: cleanup-hosting

# Every hour: check which scheduled posts went out (Buffer status) and delete each video from
# Cloudinary as soon as every platform has it, so the free storage never fills up.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-hosting
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages (light)
        run: pip install requests pyyaml python-dotenv tenacity tzdata

      - name: Refresh post statuses, delete published videos from Cloudinary
        run: python -m src.publish.runner --cleanup

      - name: Save
        run: |
          git config user.name "quran-shorts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output queue data/history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "cleanup: $(TZ=Africa/Cairo date '+%F %H:%M')"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 10; done
          fi
