name: clip-from-link

# Started by the Telegram poller when you send the bot a link (or a video file): takes the audio,
# transcribes it, rebuilds it on our own visuals with subtitles, hosts it and sends it to you for
# review. Approved clips are published from the queue (publishing.queue_per_day per day).
on:
  workflow_dispatch:
    inputs:
      req:
        description: 'JSON request, e.g. {"id":"1","url":"https://...","start":80,"end":125}'
        required: true

permissions:
  contents: write

concurrency:
  group: clip-${{ github.run_id }}

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # a 10-part series: ~10 min transcription + ~3 min per part
    env:
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      HF_HOME: ${{ github.workspace }}/.cache/hf
      ASR_THREADS: "4"
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # FFmpeg: a static build kept in the cache (~2 s) instead of apt (~22 s); apt only as a fallback
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1-gpl

      - name: FFmpeg
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1 || rm -rf "$HOME/ffmpeg/bin"
          fi
          if [ -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Python packages
        run: pip install -r requirements.txt faster-whisper==1.2.1 ctranslate2==4.8.4 yt-dlp

      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: .browsers
          key: browsers-${{ runner.os }}-playwright-1.64.1

      - name: Headless browser
        run: python -m playwright install --with-deps chromium

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: whisper-large-v3-turbo

      - name: Make the clip and send it for review
        env:
          REQ: ${{ inputs.req }}     # via env, never pasted into the shell command
        run: python -m src.clips --req "$REQ"

      - name: Save to the repo
        if: always()
        run: |
          git config user.name "quran-shorts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue output/review data/corrections data/sheikhs data/sounds.json data/footage_checks.json || true
          if ! git diff --cached --quiet; then
            git commit -m "clip: $(TZ=Africa/Cairo date '+%F %H:%M')"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 10; done
          fi

      - name: Alert on failure
        if: failure()
        run: >
          python -c "from src.util import load_config; load_config();
          from src.publish.notify import send;
          send('مقطع اللينك فشل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
