name: clip-sources

# Every day: the newest videos of the pages / channels in data/sources.json (added with
# "مصدر: <link>" in Telegram) become clip jobs — audio on our footage, subtitles, review.
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test listing this account URL"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: clip-sources
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Records from the private repo
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: bash tools/state.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages (light)
        run: pip install requests pyyaml python-dotenv tenacity tzdata yt-dlp

      - name: Probe one account
        if: inputs.probe != ''
        env:
          PROBE: ${{ inputs.probe }}
        run: python -m src.sources --probe "$PROBE"

      - name: Pick today's new videos
        if: inputs.probe == ''
        run: python -m src.sources --run

      - name: Start a clip job for each
        if: inputs.probe == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s .cache/clip_requests.jsonl ] || exit 0
          while IFS= read -r req; do
            gh workflow run clip.yml -R ${{ github.repository }} -f req="$req"
            sleep 20          # spread the jobs a little
          done < .cache/clip_requests.jsonl

      - name: Save what was taken
        if: inputs.probe == ''
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          bash tools/state.sh save "sources: $(TZ=Africa/Cairo date '+%F %H:%M')"
