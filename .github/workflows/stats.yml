name: performance-stats

# Every day: views / likes / watch time of each post (Buffer: YouTube, TikTok, Instagram; Facebook:
# Graph API) into data/stats.json. Saturdays: the weekly report in Telegram + gentle tuning of what
# gets picked (data/tuning.json). /report in the bot shows the latest numbers any time.
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Also send the report now (and tune)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: performance-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Records from the private repo
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: bash tools/state.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages (light)
        run: pip install requests pyyaml python-dotenv tenacity tzdata

      - name: Collect, and on Saturdays report + tune
        run: |
          if [ "${{ inputs.report }}" = "true" ] || [ "$(TZ=Africa/Cairo date +%u)" = "6" ]; then
            python -m src.stats --collect --report --tune
          else
            python -m src.stats --collect
          fi

      - name: Daily health check (Facebook, Buffer, Cloudinary, Gemini) — writes only if you're needed
        if: always()
        run: python -m src.health --check || true

      - name: Save
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          bash tools/state.sh save "stats: $(TZ=Africa/Cairo date '+%F %H:%M')"
