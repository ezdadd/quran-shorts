name: performance-stats

# Every day: views / likes / watch time of each post (Buffer: YouTube, TikTok, Instagram; Facebook:
# Graph API) into data/stats.json. Saturdays: the weekly report in Telegram + gentle tuning of what
# gets picked (data/tuning.json). /report in the bot shows the latest numbers any time.
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Also send the report now (and tune)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: performance-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages (light)
        run: pip install requests pyyaml python-dotenv tenacity tzdata

      - name: Collect, and on Saturdays report + tune
        run: |
          if [ "${{ inputs.report }}" = "true" ] || [ "$(TZ=Africa/Cairo date +%u)" = "6" ]; then
            python -m src.stats --collect --report --tune
          else
            python -m src.stats --collect
          fi

      - name: Save
        run: |
          git config user.name "quran-shorts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/tuning.json 2>/dev/null || git add data/stats.json || true
          if ! git diff --cached --quiet; then
            git commit -m "stats: $(TZ=Africa/Cairo date '+%F %H:%M')"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 10; done
          fi
