name: daily-shorts

# Every 3 hours (the Cloudflare Worker starts it on time; GitHub's own cron below is only a
# daily backup): make today's next Quran video(s), send them to Telegram for review, schedule
# every approved video into today's remaining windows, and commit the state back to the repo.
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: generate only — publish nothing, commit nothing"
        type: boolean
        default: false
      count:
        description: "Force this many Quran videos (empty = top up to the daily count)"
        type: string
        default: ""
      theme:
        description: "Only this theme (a quran.theme_weights key; empty = any)"
        type: string
        default: ""
      jobs:
        description: 'From /generate: JSON list [{"count":3,"theme":"","reciter":"","passage":"18:1-10"}]'
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}    # hadith narration + footage modesty check
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}     # kids' story pictures (Workers AI)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HF_HOME: ${{ github.workspace }}/.cache/hf
      ASR_THREADS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # FFmpeg: a static build kept in the cache (~2 s) instead of apt (~22 s); apt only as a fallback
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1-gpl

      - name: FFmpeg
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1 || rm -rf "$HOME/ffmpeg/bin"
          fi
          if [ -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Python packages
        run: pip install -r requirements.txt faster-whisper==1.2.1 ctranslate2==4.8.4   # whisper checks the narration

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: whisper-large-v3-turbo

      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: .browsers
          key: browsers-${{ runner.os }}-playwright-1.64.1

      - name: Headless browser (Arabic text rendering)
        run: python -m playwright install --with-deps chromium

      - name: Restore Quran text / recitation cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/api
            .cache/audio
          key: quran-data-${{ github.run_id }}
          restore-keys: quran-data-

      - name: Generate videos for today and the next days (tops up rejected ones too)
        env:
          COUNT: ${{ inputs.count }}     # via env, never pasted into the shell command
          THEME: ${{ inputs.theme }}
          JOBS: ${{ inputs.jobs }}
        run: |
          if [ -n "$JOBS" ]; then          # /generate menu: each job = count + theme / sheikh / passage
            echo "$JOBS" | jq -c '.[]' | while read -r j; do
              N=$(echo "$j" | jq -r '.count'); T=$(echo "$j" | jq -r '.theme // ""')
              R=$(echo "$j" | jq -r '.reciter // ""'); P=$(echo "$j" | jq -r '.passage // ""')
              if [ "$(echo "$j" | jq -r '.kind // "quran"')" = "hadith" ]; then
                python -m src.hadith --generate "$N" ${T:+--topic "$T"} || echo "job failed: $j"
                continue
              fi
              if [ "$(echo "$j" | jq -r '.kind // "quran"')" = "kids" ]; then
                python -m src.kids --generate "$N" || echo "job failed: $j"
                continue
              fi
              python -m src.main --no-publish --generate "$N" ${T:+--theme "$T"} ${R:+--reciter "$R"} \
                ${P:+--passage "$P"} || echo "job failed: $j"
            done
            exit 0
          fi
          if [ -n "${{ inputs.count }}" ]; then
            python -m src.main --no-publish --generate "$COUNT" ${THEME:+--theme "$THEME"} ${{ inputs.dry_run && '--dry-run' || '' }}
            exit 0
          fi
          # every 3 hours (started by the Cloudflare Worker): a few new videos for today, sent to you
          # right away, until today has daily.quran_count; rejected ones get replaced the same way
          PER_RUN=$(python -c "from src.util import load_config; print(load_config()['daily'].get('per_run', 1))")
          D=$(TZ=Africa/Cairo date +%F)
          python -m src.main --no-publish --top-up --max-new "$PER_RUN" --date "$D" ${{ inputs.dry_run && '--dry-run' || '' }}
          # and a hadith video now and then (daily.hadith_per_day); it is sent for review by itself
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m src.hadith --top-up --max-new 1 || echo "hadith step failed"
            python -m src.kids --top-up --max-new 1 || echo "kids step failed"
          fi

      - name: Send new videos to Telegram for review
        if: ${{ !inputs.dry_run }}
        run: python -m src.review.telegram send

      - name: Clean up yesterday + publish today's approved videos (one retry)
        if: ${{ !inputs.dry_run }}
        run: |
          python -m src.publish.runner --cleanup || true
          python -m src.publish.runner || (sleep 120 && python -m src.publish.runner)

      - name: Save state to the repo
        if: ${{ !inputs.dry_run && always() }}
        run: |
          git config user.name "quran-shorts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json output queue data/footage_checks.json data/sounds.json || true
          if ! git diff --cached --quiet; then
            git commit -m "daily: $(TZ=Africa/Cairo date +%F)"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 10; done
          fi

      - name: Keep today's videos for 3 days (Actions → this run → Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/**/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        run: >
          python -c "from src.util import load_config; load_config();
          from src.publish.notify import send;
          send('GitHub Actions daily run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
