# ============================================================
#  quran-shorts — كل الإعدادات هنا. الأسرار في .env بس.
# ============================================================

timezone: Africa/Cairo

daily:
  # فيديوهات القرآن في اليوم: بتتعمل على مدار اليوم، كل 3 ساعات per_run فيديو جديد يوصلك للمراجعة
  # (3 و6 و9 الصبح و12 و3 و6 و9 بالليل و12 بالليل بتوقيت القاهرة) لحد ما توصل للعدد ده
  quran_count: 8
  per_run: 1
  # فيديوهات الأحاديث (صحيح/حسن بس، من HadeethEnc): بتتعمل مع نفس الدورة كل 3 ساعات لحد العدد ده،
  # وبتتنشر في اليوم زيادة على مقاطع اللينكات
  hadith_per_day: 2
  # عناصر من طابور المراجعة (دروس/تسجيلات نادرة متوافق عليها) تتنشر في اليوم زيادة على القرآني
  queue_per_day: 3

video:
  width: 1080
  height: 1920
  fps: 30
  lead_in: 1.0          # ثانية قبل أول آية
  tail: 2.0             # ثانيتين بعد آخر آية
  max_duration: 59.0    # الحد الأقصى لطول الفيديو
  crf: 20
  maxrate: 8M           # سقف للبت ريت (مقاطع المية والرغوة بتكبر الملف جدًا)
  bufsize: 16M
  preset: veryfast
  audio_bitrate: 192k

# ------------------------------------------------------------
# القراء — الفولدرات اتأكدت من everyayah.com/data/recitations.js
# quran_com_id: رقم التلاوة في Quran.com API v4 (لتوقيت كلمة كلمة)
# ------------------------------------------------------------
reciters:
  husary:
    name_ar: محمود خليل الحصري
    everyayah_folder: Husary_128kbps
    quran_com_id: 6
    weight: 1
  minshawi:
    name_ar: محمد صديق المنشاوي
    everyayah_folder: Minshawy_Murattal_128kbps
    quran_com_id: 9
    weight: 1
  # المصحف المجوّد للمنشاوي (الأداء الخاشع). label_ar بيظهر جنب اسم القارئ في الفيديو والكابشن.
  # التلاوة المجوّدة بطيئة (آية 3:190 لوحدها 32 ث) فالمقاطع الطويلة بتتستبعد تلقائيًا.
  minshawi_mujawwad:
    name_ar: محمد صديق المنشاوي
    label_ar: تلاوة باكية
    everyayah_folder: Minshawy_Mujawwad_192kbps
    quran_com_id: 8
    weight: 1
  alafasy:
    name_ar: مشاري راشد العفاسي
    everyayah_folder: Alafasy_128kbps
    quran_com_id: 7
    weight: 1
  abdulbasit:
    name_ar: عبد الباسط عبد الصمد
    everyayah_folder: Abdul_Basit_Murattal_192kbps
    quran_com_id: 2
    weight: 1
  abdulbasit_mujawwad:
    name_ar: عبد الباسط عبد الصمد
    label_ar: تلاوة مجوّدة
    everyayah_folder: Abdul_Basit_Mujawwad_128kbps
    quran_com_id: 1
    weight: 1
  # المعيقلي والدوسري: مفيش توقيت كلمات منشور ليهم، فالآية بتظهر كاملة من غير تلوين كلمة بكلمة
  maher:
    name_ar: ماهر المعيقلي
    everyayah_folder: MaherAlMuaiqly128kbps
    weight: 1
  yasser:
    name_ar: ياسر الدوسري
    everyayah_folder: Yasser_Ad-Dussary_128kbps
    weight: 1
  qatami:
    name_ar: ناصر القطامي
    everyayah_folder: Nasser_Alqatami_128kbps
    weight: 1
  # تسجيل نادر للمنشاوي (1967) من mp3quran.net. مفيش له توقيت آيات منشور، فبيتعمله
  # محاذاة محليًا بـ whisper مع نص الـ API. weight: 0 = مش بيدخل التشغيل اليومي التلقائي؛
  # بيتولد على جهازك بـ --reciter minshawi_1967 وكل فيديو منه لازم مراجعتك قبل النشر.
  minshawi_1967:
    name_ar: محمد صديق المنشاوي
    label_ar: تلاوة نادرة ١٩٦٧
    source: mp3quran_aligned
    mp3quran_server: https://cdn.mp3quran.net/audio/muhammad-minshawi/r4/
    mp3quran_moshaf: 10924
    requires_review: true
    weight: 0
# قراء بيجيبوا Content ID claims اتكتبهم هنا عشان يتستبعدوا
excluded_reciters: []

quran:
  # المصدر الأساسي للنص: Quran.com v4 (text_uthmani + كلمات متطابقة مع توقيت التلاوة)
  # والنص بيتراجع على alquran.cloud (quran-uthmani) حرف بحرف بعد حذف التشكيل؛ لو اختلفوا المقطع بيترفض.
  cross_check: true
  # مقطع مايتكررش قبل كام يوم
  passage_cooldown_days: 45
  # احتمال اختيار كل نوع آيات (أعلى = أكتر). الأولوية للحكمة والوعظ والصبر لأنها الأكتر تفاعلًا.
  theme_weights:
    حكمة ووعظ: 5
    طمأنينة وصبر: 4
    رحمة ومغفرة: 3
    دعاء: 2
    تسبيح وتعظيم: 1
    تأمل في الخلق: 1

# ------------------------------------------------------------
# مقاطع الطبيعة: تصنيف -> كلمات بحث
# ------------------------------------------------------------
footage:
  providers: [pexels, pixabay, local]   # بالترتيب؛ local = assets/footage/<category>/*.mp4
  min_width: 1080
  min_height: 1920
  reuse_cooldown_days: 60
  categories:
    ocean:     ["ocean waves", "sea waves aerial", "calm sea", "ocean sunset", "waves on rocks"]
    rain:      ["rain drops", "rain on leaves", "rainy window", "rain forest"]
    forest:    ["forest", "green forest aerial", "sunlight trees", "misty forest"]
    mountain:  ["mountains", "mountain clouds", "mountain lake", "snowy peaks"]
    sky:       ["clouds timelapse", "sunset sky", "sky clouds", "starry night sky", "above the clouds",
                "clouds aerial", "sky timelapse"]
    desert:    ["desert dunes", "sand dunes aerial", "desert sunset"]
    waterfall: ["waterfall", "waterfall slow motion", "jungle waterfall"]
    river:     ["river", "mountain stream", "flowing water"]
    snow:      ["snowfall", "snowy forest", "winter landscape"]
    storm:     ["lightning storm", "storm clouds", "thunderstorm"]
    # جديد — مشاهد بتشد (تايم لابس / درون / سلو موشن / جرافيكس). كل مقطع جديد بيتفحص بالـ AI قبل استخدامه
    space:     ["galaxy", "nebula space", "planet earth from space", "milky way timelapse", "universe stars"]
    home:      ["cozy fireplace", "rain on window night", "candle light dark", "lantern night", "cozy cabin snow"]
    farm:      ["wheat field", "green fields aerial", "farm aerial", "sheep grazing", "horses running field"]
    animals:   ["lion", "eagle flying", "deer forest", "birds flying flock", "dolphins", "whale underwater"]
    flowers:   ["blooming flower timelapse", "rose petals", "cherry blossom", "flower field", "tulips"]
    graphics:  ["golden particles", "light rays", "abstract light background", "islamic pattern animation",
                "3d flowers animation"]
    islamic:   ["mosque dome", "islamic architecture", "minaret sunset", "mosque aerial"]
    underwater: ["underwater coral", "jellyfish", "underwater light rays", "tropical fish"]
    roads:     ["highway aerial", "driving pov road", "mountain road drive", "scenic road aerial", "winding road aerial",
                "road trip landscape", "tunnel driving", "highway timelapse night"]
  category_weights:
    ocean: 3
    rain: 2
    forest: 2
    mountain: 2
    sky: 3
    desert: 1
    waterfall: 2
    river: 2
    snow: 1
    storm: 1
    space: 3
    home: 2
    farm: 2
    animals: 2
    flowers: 2
    graphics: 2
    islamic: 2
    underwater: 1
    roads: 3
  # كل مقطع جديد بيتعرض على Gemini (صور منه) ويترفض لو فيه ست أو أي إنسان أو عري أو صليب/أصنام أو خمر
  # أو موسيقى أو خنزير أو لوجو. لو الفحص مش متاح ساعتها، بيتستخدم بس الأقسام دي (طبيعة بحتة):
  vision_check: true
  no_check_needed: [ocean, rain, forest, mountain, sky, desert, waterfall, river, snow, storm]
  # كلمات في رابط المقطع تخليه يتستبعد (ناس / وشوش)
  blocked_words: [man, woman, men, women, person, people, girl, boy, child, kid, couple,
                  surfer, surfing, swimmer, hiker, tourist, face, portrait, model, family,
                  friends, selfie, wedding, dancing, yoga, fishing, walking, running, holding]

# ------------------------------------------------------------
# صوت الطبيعة: تصنيف المقطع -> فولدرات assets/ambience/
# ------------------------------------------------------------
ambience:
  enabled: true
  # لو قسم المشاهد ملوش صوت طبيعة (أو الفولدر فاضي) بيتاخد صوت هادي عام منهم — مفيش فيديو صامت
  fallback: [wind, rain, forest]
  # مستوى صوت الطبيعة نسبةً للتلاوة (dB)
  level_db: [-28, -22]
  fade: 2.0
  target_lufs: -14
  map:
    ocean:     [ocean]
    rain:      [rain]
    forest:    [forest, birds]
    mountain:  [wind]
    sky:       [wind]
    desert:    [wind]
    waterfall: [river]
    river:     [river]
    snow:      [wind]
    storm:     [storm, rain]
    space:     []
    home:      [rain]
    farm:      [birds, forest]
    animals:   [birds, forest]
    flowers:   [birds]
    graphics:  []
    islamic:   [wind]
    underwater: [ocean]
    roads:     [wind]

# ------------------------------------------------------------
# القوالب العشوائية (الأوزان قابلة للتعديل)
# ------------------------------------------------------------
templates:
  # خطوط عريضة (Bold) وحجم كبير عشان الوضوح. size = الحجم المبدئي؛ الآية الطويلة بتتقسم على
  # أكتر من شاشة بدل ما الخط يصغر. max_lines = أقصى عدد سطور في الشاشة الواحدة.
  fonts:
    scheherazade: {file: ScheherazadeNew-Bold.ttf, weight: 4, size: 96}
    noto_naskh:   {file: "NotoNaskhArabic[wght].ttf", css_weight: 700, weight: 3, size: 90}
    harmattan:    {file: Harmattan-Bold.ttf, weight: 2, size: 92}
    lateef:       {file: Lateef-Bold.ttf, weight: 2, size: 112}
    # Amiri: التشكيل بيطلع بعيد عن الحروف في الآيات — متوقف (weight 0) ومتساب للفيديوهات القديمة بس
    amiri:        {file: Amiri-Bold.ttf, weight: 0, size: 92, attach_marks: true}
    amiri_quran:  {file: AmiriQuran-Regular.ttf, weight: 0, size: 96, attach_marks: true}
  # ترجمة كلام الشيوخ (مقاطع اللينكات والدروس): خط عشوائي لكل فيديو
  sub_fonts:
    noto_naskh: {file: "NotoNaskhArabic[wght].ttf", css_weight: 700, weight: 3, size: 70}
    ibm_plex:   {file: IBMPlexSansArabic-Bold.ttf, weight: 3, size: 66}
    noto_kufi:  {file: "NotoKufiArabic[wght].ttf", css_weight: 700, weight: 2, size: 62}
    readex:     {file: "ReadexPro[HEXP,wght].ttf", css_weight: 600, weight: 2, size: 64}
    harmattan:  {file: Harmattan-Bold.ttf, weight: 2, size: 74}
  # خط العناوين الصغيرة (اسم السورة، القارئ، اسم القناة)
  label_fonts: {Amiri-Regular.ttf: 3, ArefRuqaa-Bold.ttf: 2, "ReemKufi[wght].ttf": 1}
  min_size: 64
  max_lines: {center: 4, lower: 3}
  # center = نص الشاشة (أوضح مكان، بعيد عن أزرار المنصات والكابشن تحت)
  position:   {center: 5, lower: 1}
  # النص على الفيديو على طول من غير كارت (اختيارك): حدود غامقة قوية + ظل، ولو المشهد فاتح جدًا
  # الفيديو كله بيتعتّم شوية (dim) بدل ما يتحط مربع ورا الكلام
  background: {shadow: 1, band: 0, frame: 0, ribbon: 0, blur: 0, dim: 0}
  animation:  {whole: 3, line: 2, word: 3}   # word بيشتغل بس لو توقيت الكلمات متاح
  entrance:   {fade: 3, rise: 2}             # rise = النص بيطلع لفوق بنعومة وهو بيظهر
  # تلوين سينمائي
  grade:      {none: 1, warm: 2, cool: 1, teal_orange: 2, golden: 2, moody: 1, film: 2, dusk: 1, bw: 1}
  # حركة الكاميرا على الخلفية
  camera:     {zoom_in: 3, zoom_out: 2, pan: 2, still: 1}
  # مؤثرات (احتمال كل واحد)
  grain: 0.4          # حبيبات فيلم خفيفة
  bloom: 0.3          # توهج ناعم للإضاءة
  letterbox: 0.2      # شرايط سودا فوق وتحت (شكل سينما)
  vignette: 0.5
  show_title: 0.6     # اسم السورة ورقم الآية فوق
  show_reciter: 0.7   # اسم القارئ تحت
  colors:
    white: "#FFFFFF"
    gold:  "#F2D27A"
    cream: "#FFF4DC"
  # لون الكلام: مميز وظاهر على أي خلفية (الدهبي أغلب الوقت)
  text_colors: {gold: 3, white: 2}

# ------------------------------------------------------------
# الكابشن والهاشتاجات
# ------------------------------------------------------------
captions:
  openers:
    - "آيات تريح القلب"
    - "استمع بقلبك"
    - "دقيقة مع كتاب الله"
    - "طمأنينة"
    - "تلاوة خاشعة"
    - "تدبّر"
    - "سبحان الله"
    - "لحظة سكينة"
  hashtags_core: ["#قرآن", "#تلاوة", "#القرآن_الكريم"]
  hashtags_pool: ["#راحة_نفسية", "#تدبر", "#قرآن_كريم", "#طمأنينة", "#ذكر_الله",
                  "#آيات", "#تلاوة_خاشعة", "#quran", "#shorts", "#اسلام", "#سكينة"]
  hashtag_count: [3, 5]
  footage_credit: false   # Pixabay/Pexels لا يشترطوا ذكر المصدر
  # وسوم ثابتة على كل الفيديوهات (قرآن ومقاطع)، بعد الوسوم الخاصة بكل فيديو.
  # يوتيوب بيتجاهل كل الوسوم لو أكتر من 15، فبيتقص لـ 15 هناك؛ إنستجرام حده 30.
  fixed_hashtags: ["#viral", "#fyp", "#foryou", "#foryourpage", "#quran", "#Hadith", "#reels", "#free",
                   "#trend", "#trending", "#trendy", "#المنشاوي", "#الحصري", "#الدوسري", "#الاسلام",
                   "#تلاوة", "#قرأن", "#محمد_صديق_المنشاوي", "#القرأن_الكريم"]

asr:
  model: large-v3-turbo   # على الـ CPU: ~0.7x من الوقت الحقيقي (ساعة صوت ≈ 85 دقيقة)
  compute_type: int8
  cpu_threads: 4          # 8 خيوط كانت بتخلّص الذاكرة (mkl_malloc) مع الدروس الطويلة

paths:
  output: output
  cache: .cache
  history: data/history.json
  passages: data/passages.json

# ------------------------------------------------------------
# تعريف القناة: سطر صغير تحت زي يوزر التيك توك (مش watermark كبيرة)
# ------------------------------------------------------------
branding:
  handle: "ازْدَدْ · @EZDADD_"
  y: 1735
  size: 32
  opacity: 0.9

# ------------------------------------------------------------
# الدروس (المرحلة 2)
# ------------------------------------------------------------
lectures:
  min_seconds: 30
  max_seconds: 60

# مقاطع من لينكات (بتتبعت للبوت): بناخد الصوت بس ونركبه على فيديو طبيعة بترجمة
clips:
  min_seconds: 20
  max_seconds: 60
  scan_minutes: 12          # لو المصدر طويل ومفيش وقت محدد: بيدوّر في أول 12 دقيقة
  full_max_seconds: 180     # الفيديو اللي بتبعته بيتستخدم كله من غير تقسيم لحد 3 دقايق (حد يوتيوب شورتس)
                            # (فيسبوك: الأطول من 90 ث بيتنشر فيديو عادي مش ريلز)
  max_series_parts: 10      # الفيديو الأطول من دقيقة بيتقسم أجزاء ورا بعض، بحد أقصى 10 أجزاء
  credit_source: false      # مفيش "المصدر:" في الوصف (اختيارك)
  openers: ["تذكير ينفع القلب", "كلام يريح القلب", "اسمعها للآخر", "موعظة"]
  hashtags_pool: ["#موعظة", "#تذكير", "#دروس_دينية", "#اسلام", "#راحة_نفسية", "#كلام_يريح_القلب", "#shorts"]

# ------------------------------------------------------------
# النشر (المرحلة 3)
# youtube/tiktok/instagram عن طريق Buffer (الخطة المجانية: 3 قنوات)، وfacebook عن طريق Meta مباشرة
# ------------------------------------------------------------
publishing:
  platforms: [youtube, tiktok, instagram, facebook]
  # نوافذ النشر بتوقيت القاهرة؛ كل فيديو بياخد وقت عشوائي في نافذة
  # أوقات النشر بتوقيت القاهرة، والرقم بعد x = الوزن (أعلى = بيتختار أكتر). مبنية على ذروة
  # تصفح الريلز في مصر والخليج: بعد الفجر، بريك الظهر، بعد المغرب، وأقوى حاجة بالليل قبل النوم.
  windows: ["06:30-08:30 x2", "13:30-15:30 x2", "18:00-19:45 x2", "20:30-22:30 x4", "22:30-23:55 x4"]
  # الجمعة: الناس صاحية بدري ومهتمة بالقرآن (الكهف)، وبلاش وقت الصلاة 11:30-13:30
  friday_windows: ["08:00-11:15 x4", "14:00-16:00 x2", "18:00-19:45 x2", "20:30-22:30 x4", "22:30-23:55 x3"]
  min_gap_minutes: 120           # أقل فرق بين أي فيديوهين
  platform_offset_minutes: [5, 40]  # كل منصة بتاخد نفس الفيديو بفرق عشوائي
  max_per_day: 10                # أقصى عدد فيديوهات في اليوم؛ اللي ميلحقش بيتنشر بكرة أول حاجة
  min_lead_minutes: 25           # أقل وقت بين الجدولة والنشر (فيسبوك محتاج 10+ دقايق)
  youtube_category: "27"         # Education
  delete_hosted_after_hours: 1   # يمسح الفيديو من Cloudinary بعد ما كل المنصات تأكد إنه اتنشر بالوقت ده (كل ساعة)
  facebook_api_version: v26.0
  require_approval: true   # كل فيديو محتاج موافقة: منك، أو تلقائي بعد الفحص لو معملتش حاجة (تحت)
  # فيديوهات القرآن اليومية: لو معملتش حاجة خلال auto_approve_hours بتتفحص تلقائي (النص والمدة والملف)
  # ويتوافق عليها وتتجدول لوحدها؛ اللي يفشل في الفحص بيترفض ويتعمل بداله. ❌ منك قبل النشر بيلغي.
  auto_approve: true
  auto_approve_hours: 2
  days_ahead: 2            # يتعمل فيديوهات النهارده + اليومين الجايين، وتستنى موافقتك

# ------------------------------------------------------------
# المصحح الذكي (مجاني — Gemini): لو مقطع لينك/درس فضل من غير مراجعة منك delay_hours، بيراجع الترجمة
# (بيسمع تاني الكلمات المش واضحة)، يصححها من غير ما يغيّر لهجة الشيخ، ويوافق لوحده.
# مش بيلمس الآيات ولا الأحاديث، وبيستناك لو فيه آية/حديث مش واضح أو مش واثق.
# بيتعلم من كل تصحيح بتعمله في تيليجرام (data/corrections/): التصحيح اللي بيتكرر بيتطبق لوحده،
# والأسماء بتتدّى لـ Whisper، وآخر تصحيحاتك بتتدّى للمصحح كأمثلة.
# محتاج GEMINI_API_KEY (مجاني من aistudio.google.com) في .env وفي GitHub Secrets.
# ------------------------------------------------------------
agent:
  enabled: true
  provider: gemini            # gemini (مجاني) | claude (مدفوع، محتاج ANTHROPIC_API_KEY)
  # بالترتيب: لو موديل مشغول أو بطيء بيروح للي بعده. gemini-3.5-flash كان الأسرع (7 ث للفة) في التجربة
  # flash-lite اتشال: في التجربة وافق على مقطع فيه آية متسمعة غلط. لو كلهم مشغولين المقطع بيستنى ويتجرب بعدين
  gemini_models: [gemini-3.5-flash, gemini-3.7-flash, gemini-3.8-flash, gemini-flash-latest]
  max_per_poll: 1            # مقطع واحد في كل مرة (والتاني بعد 15 دقيقة على الأقل): حد الطلبات المجاني
  gemini_timeout: 90         # ثواني لكل رد قبل ما يعتبر الموديل مشغول
  model: claude-opus-5-5      # لو provider: claude
  effort: high                # لو provider: claude
  delay_hours: 2
  auto_approve_min: medium   # high = يوافق بس لو واثق جدًا، medium = يقبل شكوك بسيطة
  min_similarity: 0.5        # تعديل بيغيّر السطر أكتر من كدا بيتلغي (عشان ميعيدش صياغة كلام الشيخ)
  max_relisten: 12
  max_turns: 16
  learn_min_count: 2         # تصحيح كررته كام مرة عشان يتطبق لوحده على المقاطع الجاية
  examples: 20               # كام تصحيح من تصحيحاتك بيتدّى للمصحح كمثال

# ------------------------------------------------------------
# الأحاديث: قراءة بصوت (Gemini، مجاني) — كل قراءة بتتراجع بـ Whisper قبل الاستخدام، ولو مطابقتها
# للنص أقل من tts_min_match بتتجرب بموديل تاني؛ لو مفيش قراءة مظبوطة الفيديو بيطلع نص بس.
# ------------------------------------------------------------
# فيديوهات "الشاشة": اللينك اللي بتبعته بيتشغل على شاشة جهاز في مشهد من عندنا (لابتوب، موبايل، تلفزيون…)
# المشاهد في data/screens.json (python -m tools.build_screens بيزوّدها ويفحصها)، ولكل فيديو شكل عشوائي
screens:
  enabled: true
  phone_share: 0.7     # الفيديو الطولي: نسبة ما يتعرض على موبايل (والباقي لابتوب/تلفزيون)
  # looks: {camera: {push: 4, still: 2, pull: 2, drift: 2}, grade: {...}, title: {...}}  # لتغيير الأوزان

# ------------------------------------------------------------
# قصص الأطفال: قصة مرسومة قصيرة بتشرح حديث صحيح (الحديث بنصه من HadeethEnc، والقصة Gemini، والرسوم
# Flux على Cloudflare Workers AI ببلاش، وكل رسمة بتتفحص: لا ستات ولا بنات ولا وشوش مرسومة ولا صلبان)
kids:
  enabled: false   # متوقفة لحد ما نشترك في نموذج مدفوع (القصة والرسوم)
  per_day: 1        # بتتعمل مع دورة الـ 3 ساعات لحد العدد ده، وبتتنشر في اليوم زيادة على الباقي
  voice: Puck

hadith:
  narrate: true
  voice: Charon            # صوت رجالي عميق وهادي
  tts_models: [gemini-3.1-flash-tts-preview, gemini-2.5-flash-preview-tts]
  tts_min_match: 0.9

# ------------------------------------------------------------
# مكتبة الأصوات: ابعت لينك للبوت ومعاه «صوت: الاسم» — أي صوت بيتحفظ (كلام، أغنية، نشيد، طبيعة) ويتصنّف.
# قاعدة: فيديوهات القرآن والأحاديث عمرها ما بتستخدم الأصوات دي. الصوت بيتستخدم بس لما تطلبه:
# زرار 🎬 في /sounds بيعمل فيديو جديد بالصوت ده على مشاهدنا.
# ------------------------------------------------------------
sounds:
  max_seconds: 180

# ------------------------------------------------------------
# مصادر تلقائية: حسابات تيك توك — كل يوم فيديو عشوائي من كل حساب (الصوت بس على مشاهدنا).
# بتضيفها من تيليجرام: «مصدر: اللينك الشيخ فلان» (يوتيوب أو تيك توك)، و /sources تشوفها وتمسحها.
# ------------------------------------------------------------
sources:
  max_per_day: 3        # أقصى عدد مقاطع جديدة من كل المصادر في اليوم
  per_source: 1         # من كل صفحة في اليوم (عشان مناخدش كتير من نفس الصفحة)
  pick: random          # random = فيديو عشوائي من آخر pool فيديو للحساب (مش مكرر) | newest = الأحدث
  pool: 40
  min_seconds: 15
  max_seconds: 300      # الفيديوهات الأطول من 5 دقايق بتتساب
